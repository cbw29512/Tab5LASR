name: LASR microSD recorder build and host tests
on:
  push:
    paths:
      - 'onboard/main/lasr_session_*'
      - 'onboard/main/lasr_sd_*'
      - 'onboard/main/lasr_usb_*'
      - 'onboard/main/Kconfig.projbuild'
      - 'onboard/main/main.c'
      - 'onboard/main/CMakeLists.txt'
      - 'onboard/sdkconfig.defaults'
      - 'onboard/tests/test_lasr_session_store.c'
      - 'onboard/tests/test_lasr_usb_wire.c'
      - 'tools/tests/test_lasr_usb_protocol.py'
      - 'tools/test_lasr_store_host.sh'
      - '.github/workflows/lasr-sd-session.yml'
  pull_request:
    paths:
      - 'onboard/main/lasr_session_*'
      - 'onboard/main/lasr_sd_*'
      - 'onboard/main/lasr_usb_*'
      - 'onboard/main/Kconfig.projbuild'
      - 'onboard/tests/test_lasr_session_store.c'
      - 'onboard/tests/test_lasr_usb_wire.c'
      - 'tools/tests/test_lasr_usb_protocol.py'
      - '.github/workflows/lasr-sd-session.yml'
  workflow_dispatch:

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/test_lasr_store_host.sh
      - run: python -m unittest discover -s tools/tests -v
      - name: Limit new module sizes
        run: |
          set -euo pipefail
          for f in onboard/main/lasr_session_*.[ch] onboard/main/lasr_sd_*.[ch]; do
            n=$(wc -l < "$f")
            test "$n" -le 150 || { echo "Split $f ($n lines)"; exit 1; }
          done
  firmware-size-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app with experimental microSD worker
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.1
          target: esp32p4
          path: onboard
      - name: Reject oversized/nonmatching app image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install esptool==5.6.0
          test -f onboard/build/tab5lasr_onboard.bin
          python -m esptool --chip esp32p4 image-info onboard/build/tab5lasr_onboard.bin > /tmp/image.txt
          cat /tmp/image.txt
          grep -Fq 'Minimal chip revision: v1.0' /tmp/image.txt
          grep -Fq 'Maximal chip revision: v1.99' /tmp/image.txt
          test $(stat -c%s onboard/build/tab5lasr_onboard.bin) -le 1048576 || {
            echo 'BLOCKED: existing 1MiB app partition cannot fit this image'; exit 1;
          }
      - name: No automatic firmware publish or flash
        run: |
          echo "Review build only: no Tab5 was flashed."