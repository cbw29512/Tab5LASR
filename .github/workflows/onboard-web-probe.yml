name: Experimental Tab5 LAN Camera Probe
on:
  push:
    branches: ['feat/lasr-onboard-web-20261117']
    paths:
      - 'onboard/**'
      - 'web/**'
      - '.github/workflows/onboard-web-probe.yml'
  workflow_dispatch:
jobs:
  browser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check web/app.js
          node --check web/model.js
          node --test web/tests/*.test.mjs
  wifi-camera-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable experimental Wi-Fi and 2MiB partition ONLY in CI
        run: |
          set -euo pipefail
          cat onboard/sdkconfig.web_probe >> onboard/sdkconfig.defaults
          cat onboard/sdkconfig.partition_2m_probe >> onboard/sdkconfig.defaults
          grep -Fq 'CONFIG_LASR_WEB_ENABLED=y' onboard/sdkconfig.defaults
          grep -Fq 'CONFIG_PARTITION_TABLE_CUSTOM=y' onboard/sdkconfig.defaults
      - name: Unit-test proposed partition layout (no device writes)
        run: python -m unittest discover -s firmware/tests -p 'test_proposed_partition.py' -v
      - name: Compile ESP32-P4 CSI camera with hosted C6 and JPEG HTTP
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.1
          target: esp32p4
          path: onboard
      - name: Review only — require exact 2MiB factory layout and ESP32-P4 rev1.x
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install esptool==5.6.0
          test -f onboard/build/tab5lasr_onboard.bin
          python -m esptool --chip esp32p4 image-info onboard/build/tab5lasr_onboard.bin > image_info.txt
          grep -Fq 'Minimal chip revision: v1.0' image_info.txt
          grep -Fq 'Maximal chip revision: v1.99' image_info.txt
          python tools/verify_proposed_partition.py onboard/build/partition_table/partition-table.bin
          BYTES=$(stat -c%s onboard/build/tab5lasr_onboard.bin)
          echo "WEB_CAMERA_IMAGE_BYTES=$BYTES"
          echo "CURRENT_DEVICE_APP_CAPACITY=1048576"
          echo "REVIEW_CANDIDATE_APP_CAPACITY=2097152"
          if [ "$BYTES" -gt 2097152 ]; then
            echo "::error::WEB APP TOO LARGE even for 2MiB review candidate."
            exit 1
          fi
          echo "::warning::This is a candidate requiring a NEW partition table. DO NOT FLASH before backups, erased-region audit and C6 compatibility review."
      - name: Review-only artifact (never auto-flash)
        uses: actions/upload-artifact@v4
        with:
          name: web-camera-2m-candidate-NOT-FLASH-APPROVED-${{ github.sha }}
          path: |
            onboard/build/tab5lasr_onboard.bin
            onboard/build/partition_table/partition-table.bin
          retention-days: 14
