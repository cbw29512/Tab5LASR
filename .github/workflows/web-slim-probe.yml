name: Tab5 Web Slim LVGL Probe (not flashable)
on:
  push:
    branches: ['feat/lasr-onboard-web-20261117']
    paths:
      - 'onboard/sdkconfig.lvgl_slim_probe'
      - '.github/workflows/web-slim-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-size-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose candidate configuration (checkout only)
        run: |
          set -euo pipefail
          cat onboard/sdkconfig.web_probe >> onboard/sdkconfig.defaults
          cat onboard/sdkconfig.partition_2m_probe >> onboard/sdkconfig.defaults
          cat onboard/sdkconfig.lvgl_slim_probe >> onboard/sdkconfig.defaults
          grep -Fq CONFIG_LV_USE_BUTTON=y onboard/sdkconfig.defaults
          if grep -Fq CONFIG_LV_CONF_MINIMAL=y onboard/sdkconfig.defaults; then
            echo 'Retired LVGL minimal option is prohibited'; exit 1
          fi
      - name: Compile full camera/battery/Wi-Fi with slim LVGL
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.1
          target: esp32p4
          path: onboard
          command: "idf.py build && idf.py size-components > build/slim-components.txt && idf.py size-files > build/slim-files.txt"
      - name: Publish measured app size and preserve exact 2MiB review table
        run: |
          set -euo pipefail
          python tools/verify_proposed_partition.py onboard/build/partition_table/partition-table.bin
          BYTES=$(stat -c%s onboard/build/tab5lasr_onboard.bin)
          echo "SLIM_CAMERA_IMAGE_BYTES=$BYTES"
          echo "CURRENT_DEVICE_APP_MAX_BYTES=1048576"
          if [ "$BYTES" -gt 1048576 ]; then
            echo "::warning::STILL TOO BIG for installed partition. DO NOT FLASH."
          else
            echo "::notice::Fits binary size; STILL NOT FLASH-APPROVED because C6/physical battery/network tests remain."
          fi
      - name: Archive analysis reports only
        uses: actions/upload-artifact@v4
        with:
          name: lasr-slim-size-reports-${{ github.sha }}
          path: |
            onboard/build/slim-components.txt
            onboard/build/slim-files.txt
          if-no-files-found: error
          retention-days: 14
