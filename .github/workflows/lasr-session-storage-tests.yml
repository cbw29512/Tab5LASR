name: LASR microSD session storage core
on:
  push:
    paths:
      - 'onboard/main/lasr_session_*'
      - 'onboard/main/lasr_recorder_*'
      - 'onboard/main/lasr_laser_pulse.*'
      - 'onboard/main/lasr_raw_pixel.*'
      - 'onboard/main/lasr_laser_blob.*'
      - 'onboard/main/lasr_shot_clock.*'
      - 'onboard/main/lasr_laser_pipeline.*'
      - 'onboard/main/lasr_csi_*'
      - 'onboard/main/lasr_transfer_guard.*'
      - 'onboard/tests/test_lasr_*'
      - '.github/workflows/lasr-session-storage-tests.yml'
  pull_request:
    paths:
      - 'onboard/main/lasr_session_*'
      - 'onboard/main/lasr_recorder_*'
      - 'onboard/main/lasr_laser_pulse.*'
      - 'onboard/main/lasr_raw_pixel.*'
      - 'onboard/main/lasr_laser_blob.*'
      - 'onboard/main/lasr_shot_clock.*'
      - 'onboard/main/lasr_laser_pipeline.*'
      - 'onboard/main/lasr_csi_*'
      - 'onboard/main/lasr_transfer_guard.*'
      - 'onboard/tests/test_lasr_*'
      - '.github/workflows/lasr-session-storage-tests.yml'
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable storage and recorder state tests
        run: |
          set -euo pipefail
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -g \
            -fsanitize=undefined -Ionboard/main \
            onboard/main/lasr_session_fs.c onboard/main/lasr_session_store.c \
            onboard/tests/test_lasr_session_store.c -lm -o /tmp/lasr_store
          /tmp/lasr_store
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -g \
            -fsanitize=undefined -Ionboard/main \
            onboard/main/lasr_session_fs.c onboard/main/lasr_session_store.c \
            onboard/main/lasr_recorder_core.c \
            onboard/tests/test_lasr_recorder_core.c -lm -o /tmp/lasr_core
          /tmp/lasr_core
      - name: USB exclusive media arbitration tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -g -fsanitize=undefined \
            -Ionboard/main onboard/main/lasr_transfer_guard.c \
            onboard/tests/test_lasr_transfer_guard.c -o /tmp/lasr_guard
          /tmp/lasr_guard
      - name: Camera laser pulse state tests (synthetic, no hardware claims)
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -g -fsanitize=undefined \
            -Ionboard/main onboard/main/lasr_laser_pulse.c \
            onboard/tests/test_lasr_laser_pulse.c -lm -o /tmp/lasr_pulse
          /tmp/lasr_pulse
      - name: Raw CSI format, brightness and pulse tests (synthetic only)
        run: |
          set -euo pipefail
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -g \
            -fsanitize=undefined -Ionboard/main \
            onboard/main/lasr_raw_pixel.c onboard/main/lasr_laser_blob.c \
            onboard/main/lasr_laser_pipeline.c onboard/main/lasr_laser_pulse.c \
            onboard/main/lasr_csi_format.c \
            onboard/tests/test_lasr_laser_blob.c -lm -o /tmp/lasr_blob
          /tmp/lasr_blob
      - name: Device shot clock GO and split tests (synthetic only)
        run: |
          set -euo pipefail
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -g \
            -fsanitize=undefined -Ionboard/main \
            onboard/main/lasr_shot_clock.c \
            onboard/tests/test_lasr_shot_clock.c -lm -o /tmp/lasr_clock
          /tmp/lasr_clock