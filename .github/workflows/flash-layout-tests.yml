name: Tab5 Read-Only Flash Layout Tests
on:
  push:
    branches: [main]
    paths:
      - 'tools/inspect_flash_layout.py'
      - 'tools/audit_factory_expansion.py'
      - 'tools/CHECK_TAB5_WEB_EXPANSION.ps1'
      - 'firmware/tests/test_inspect_flash_layout.py'
      - 'firmware/tests/test_audit_factory_expansion.py'
      - '.github/workflows/flash-layout-tests.yml'
  workflow_dispatch:
jobs:
  layout-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check metadata-only flash parser tests
        run: |
          set -euo pipefail
          python -m unittest discover -s firmware/tests -p 'test_inspect_flash_layout.py' -v
          python -m unittest discover -s firmware/tests -p 'test_audit_factory_expansion.py' -v
          python tools/inspect_flash_layout.py --help
          python tools/audit_factory_expansion.py --help
      - name: Ensure no flash mutation commands in parser
        run: |
          if grep -Ei '(^|[[:space:]])(write-flash|erase-flash|erase-region|write_flash|erase_flash|os\.system|subprocess\.run)[[:space:](]' tools/inspect_flash_layout.py tools/audit_factory_expansion.py tools/CHECK_TAB5_WEB_EXPANSION.ps1; then
            echo 'Inspector contains a write/process command'; exit 1
          fi
